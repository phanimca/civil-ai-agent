# Cloud Build configuration for Civil AI Agent
# Free Tier-friendly defaults: low Cloud Run scale and default Cloud Build machine.

steps:
  - name: gcr.io/cloud-builders/docker
    id: pull-cache-image
    entrypoint: bash
    args:
      - -c
      - docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest || true

  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -f
      - Dockerfile
      - .
    env:
      - DOCKER_BUILDKIT=1
    waitFor: ["pull-cache-image"]

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${SHORT_SHA}
    waitFor: ["build-image"]

  - name: gcr.io/cloud-builders/docker
    id: push-latest-image
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
    waitFor: ["build-image"]

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-cloud-run
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --concurrency=${_CONCURRENCY}
      - --timeout=${_TIMEOUT}
      - --cpu-throttling
      - --no-cpu-boost
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=STREAMLIT_SERVER_HEADLESS=true,STREAMLIT_SERVER_ENABLEXSRFPROTECTION=false,STREAMLIT_SERVER_ENABLECORS=false,APP_COMMIT_SHA=${SHORT_SHA}
      - --set-secrets=OPENAI_TOKEN=OPENAI_TOKEN:latest
      - --set-secrets=HF_TOKEN=HF_TOKEN:latest
      - --set-secrets=BREVO_API_KEY=BREVO_API_KEY:latest
      - --set-secrets=BREVO_FROM_EMAIL=BREVO_FROM_EMAIL:latest
      - --set-secrets=BREVO_FROM_NAME=BREVO_FROM_NAME:latest
      - --set-secrets=RESEND_API_KEY=RESEND_API_KEY:latest
      - --set-secrets=EMAIL_FROM=EMAIL_FROM:latest
      - --set-secrets=ADMIN_SEED_EMAIL=ADMIN_SEED_EMAIL:latest
    env:
      - CLOUDSDK_COMPUTE_REGION=${_REGION}
    waitFor: ["push-image", "push-latest-image"]

  - name: gcr.io/cloud-builders/gcloud
    id: deployment-info
    args:
      - run
      - services
      - describe
      - ${_SERVICE}
      - --region=${_REGION}
      - --format=value(status.url)
    env:
      - CLOUDSDK_COMPUTE_REGION=${_REGION}
    waitFor: ["deploy-cloud-run"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${SHORT_SHA}

substitutions:
  _REGION: asia-south1
  _REPO: civil-ai-agent
  _SERVICE: civil-ai-agent
  _MEMORY: 1Gi
  _CPU: "0.5"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "1"
  _CONCURRENCY: "2"
  _TIMEOUT: "900"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

tags:
  - civil-ai-agent
  - gcp-cloud-run
  - free-tier
