[project]
name = "civil-ai-agent"
version = "0.1.0"
description = "Civil AI Inspection Agent"
requires-python = ">=3.10,<3.14"

dependencies = [
    "streamlit",
    "streamlit-extras",
    "ultralytics",
    "opencv-python-headless>=4.8.0",
    "pillow",
    "numpy",
    "reportlab",
    "openai",
    "huggingface_hub",
    "python-dotenv",
    "resend",
    "sib-api-v3-sdk"
]

[dependency-groups]
dev = [
    "pytest",
    "black"
]